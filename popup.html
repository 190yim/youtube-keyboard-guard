<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>YouTube Keyboard Guard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header class="header">
<img class="logo" src="icons/icon48.png" alt="YouTube Keyboard Guard">

      <div>
        <h1>YouTube Keyboard Guard</h1>
        <p>Protection contre les fausses manipulations</p>
      </div>
    </header>

    <main>

      <section class="protection-card">

        <div class="protection-info">
          <span class="status-dot" id="statusDot"></span>

          <div>
            <strong>Protection clavier</strong>
            <span id="status">Activée</span>
          </div>
        </div>

        <label class="switch">
          <input type="checkbox" id="toggle" checked>
          <span class="slider"></span>
        </label>

      </section>

    </main>

    <footer>
      <span>YouTube Keyboard Guard</span>
      <span>Developed by 190yim</span>
      <span>v1.0.0</span>
    </footer>

  </div>

  <script src="popup.js"></script>

</body>

</html>
