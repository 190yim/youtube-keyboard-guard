<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>YouTube Keyboard Guard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header class="header">
      <div class="logo">YK</div>

      <div>
        <h1>YouTube Keyboard Guard</h1>
        <p>Protection contre les fausses manipulations</p>
      </div>
    </header>

    <main>

      <section class="protection-card">

        <div class="protection-info">
          <span class="status-dot"></span>

          <div>
            <strong>Protection clavier</strong>
            <span id="status">Activée</span>
          </div>
        </div>

        <label class="switch">
          <input type="checkbox" id="toggle" checked>
          <span class="slider"></span>
        </label>

      </section>

      <section class="shortcuts">

        <h2>Raccourcis bloqués</h2>

        <div class="shortcut-list">
          <span>←</span>
          <span>→</span>
          <span>J</span>
          <span>L</span>
          <span>Espace</span>
          <span>K</span>
          <span>↑</span>
          <span>↓</span>
          <span>M</span>
        </div>

      </section>

    </main>

    <footer>
      <span>YouTube Keyboard Guard</span>
      <span>v1.0.0</span>
    </footer>

  </div>

  <script src="popup.js"></script>

</body>

</html>
